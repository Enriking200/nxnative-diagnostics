
name: macOS Runtime Inspection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: xcode-27

    steps:
      - name: Select Xcode 27.2
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2_Release_Candidate.app
          xcodebuild -version

      - name: Free simulator storage
        run: |
          echo "=== Deleting simulator runtimes ==="
          xcrun simctl runtime delete all
          xcrun simctl delete unavailable || true

          echo "=== Remaining runtimes ==="
          xcrun simctl runtime list

          echo "=== Available disk space ==="
          df -h /

      - name: Inspect storage
        run: |
          echo "=== Disk space ==="
          df -h /

          echo "=== Disk images ==="
          hdiutil info
